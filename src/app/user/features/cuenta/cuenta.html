<section class="mx-auto max-w-6xl px-6 pb-16">
  <header class="mt-8 mb-8 flex items-center gap-3">
    <app-icon className="size-5 text-base-content/50" strokeWidth="2.0" name="user-outline" />
    <h1 class="text-base-content text-xl font-semibold">Cuenta</h1>
  </header>

  <form (submit)="onSubmit($event)">
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
      <div class="flex flex-col gap-4">
        <h2 class="text-base-content text-base font-semibold">Foto de perfil</h2>

        <div class="border-base-300 rounded-box flex flex-col items-center gap-6 border p-6">
          @if (previewURL()) {
            <div class="border-base-300 size-32 shrink-0 overflow-hidden rounded-full border">
              <img [src]="previewURL()" alt="Foto de perfil" class="h-full w-full object-cover" />
            </div>
          } @else {
            <div
              class="bg-base-200 border-base-300 flex size-32 shrink-0 items-center justify-center rounded-full border"
            >
              <span class="text-base-content/40 text-4xl font-medium">
                {{ first_name()?.charAt(0) }}
              </span>
            </div>
          }

          <input
            type="file"
            accept="image/*"
            class="file-input file-input-bordered w-full"
            (change)="onPhotoSelected($event)"
            [disabled]="loading()"
          />
        </div>
      </div>

      <div class="flex flex-col gap-4">
        <h2 class="text-base-content text-base font-semibold">Información</h2>

        <div class="border-base-300 rounded-box overflow-hidden border">
          <div class="border-base-300 flex flex-col gap-1.5 border-b px-4 py-3">
            <label class="text-base-content/40 text-sm">Nombre</label>
            <input
              class="input input-ghost text-base-content w-full px-0 text-base focus:outline-none"
              type="text"
              [formField]="cuentaForm.first_name"
            />
          </div>

          <div class="border-base-300 flex flex-col gap-1.5 border-b px-4 py-3">
            <label class="text-base-content/40 text-sm">Apellidos</label>
            <input
              class="input input-ghost text-base-content w-full px-0 text-base focus:outline-none"
              type="text"
              [formField]="cuentaForm.last_name"
            />
          </div>

          <div class="border-base-300 flex flex-col gap-1 border-b px-4 py-3">
            <span class="text-base-content/40 text-sm">Correo electrónico</span>
            <span class="text-base-content/60 text-base">{{ email() }}</span>
          </div>

          <div class="flex flex-col gap-1 px-4 py-3">
            <span class="text-base-content/40 text-sm">UID</span>
            <span class="text-base-content/60 font-mono text-base break-all">{{ uid() }}</span>
          </div>
        </div>

        <button
          class="btn btn-primary w-full gap-1.5"
          type="submit"
          [disabled]="loading() || !hasUnsavedChanges()"
        >
          @if (loading()) {
            <span class="loading loading-spinner loading-xs"></span>
            Guardando...
          } @else {
            <app-icon name="check-outline" className="size-3.5" strokeWidth="2.0" />
            Guardar cambios
          }
        </button>
      </div>
    </div>
  </form>
</section>
