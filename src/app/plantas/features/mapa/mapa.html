<section class="relative z-0 h-[calc(100dvh-9rem)] min-h-96 w-full overflow-hidden">
  @if (error()) {
    <div
      class="bg-base-100/60 absolute inset-0 z-20 grid place-items-center backdrop-blur-sm"
      aria-live="assertive"
    >
      <div
        class="bg-base-100 border-base-300 flex w-80 max-w-[90vw] flex-col items-center gap-3 rounded-lg border p-6 text-center shadow-lg"
      >
        <app-icon className="size-7 text-error/50" name="exclamation-circle-outline" />
        <div>
          <p class="text-base-content text-sm font-medium">Error de conexión</p>
          <p class="text-base-content/40 mt-0.5 text-xs">
            Verifica tu conexión o vuelve a intentarlo.
          </p>
        </div>
        <button type="button" class="btn btn-outline btn-error btn-sm" (click)="onRetryLoad()">
          Reintentar
        </button>
      </div>
    </div>
  }

  @if (loading() && plantas().length === 0) {
    <div
      class="bg-base-100 border-base-300 absolute top-4 left-1/2 z-10 flex -translate-x-1/2 items-center gap-2.5 rounded-lg border px-4 py-2.5 shadow-md"
    >
      <span class="loading loading-spinner loading-xs text-base-content/50"></span>
      <p class="text-base-content/60 text-xs">Cargando mapa...</p>
    </div>
  }

  <div #mapContainer class="relative z-0 h-full w-full"></div>
</section>
