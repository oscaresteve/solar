<td>
  <span class="badge badge-sm badge-soft badge-info font-semibold text-nowrap shadow-md">{{
    planta().id
  }}</span>
</td>
<td>
  <p class="text-base-content text-sm font-bold">
    {{ planta().name }}
  </p>
</td>
<td>
  <p class="text-base-content">{{ planta().latitude }}, {{ planta().longitude }}</p>
</td>
<td>
  <p class="text-base-content">{{ planta().capacity | number }}</p>
</td>
<td>
  @if (planta().active) {
    <span class="badge badge-sm badge-soft badge-success font-semibold shadow-md">Activa</span>
  } @else {
    <span class="badge badge-sm badge-soft badge-error font-semibold shadow-md">Inactiva</span>
  }
</td>
<td>
  <span class="badge badge-sm badge-soft badge-gray font-semibold text-nowrap shadow-md">
    {{ planta().user_id }}
  </span>
</td>
<td>
  <p class="text-base-content">{{ planta().created_at | date: 'short' }}</p>
</td>
<td>
  <div class="rounded-box aspect-video h-20 overflow-hidden shadow-md">
    <img [src]="planta().photo_url" class="h-full w-full object-cover" />
  </div>
</td>
<td>
  <a
    [routerLink]="['/plantas', planta().id]"
    class="btn btn-md btn-primary btn-soft min-w-max font-semibold shadow-md"
  >
    Ver Más
    <app-icon className="size-4" name="chevron-right-outline" strokeWidth="2.0" />
  </a>
</td>
