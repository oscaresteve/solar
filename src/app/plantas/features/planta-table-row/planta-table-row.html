<td class="px-4 py-3">
  <span class="text-base-content/40 font-mono text-xs">{{ planta().id }}</span>
</td>

<td class="px-4 py-3">
  <span class="text-base-content text-sm font-medium">{{ planta().name }}</span>
</td>

<td class="px-4 py-3">
  <span class="text-base-content/50 font-mono text-xs text-nowrap">
    {{ planta().latitude }}, {{ planta().longitude }}
  </span>
</td>

<td class="px-4 py-3">
  <span class="text-base-content text-sm">{{ planta().capacity | number }}</span>
</td>

<td class="px-4 py-3">
  @if (planta().active) {
    <span class="badge badge-xs badge-success badge-soft">Activa</span>
  } @else {
    <span class="badge badge-xs badge-error badge-soft">Inactiva</span>
  }
</td>

<td class="px-4 py-3">
  <span class="text-base-content/50 font-mono text-xs">{{ planta().user_id }}</span>
</td>

<td class="px-4 py-3">
  <span class="text-base-content/40 text-xs text-nowrap">
    {{ planta().created_at | date: 'short' }}
  </span>
</td>

<td class="px-4 py-3">
  <div class="bg-base-200 border-base-300 aspect-video h-10 overflow-hidden rounded border">
    <img [src]="planta().photo_url" alt="Imagen" class="h-full w-full object-cover" />
  </div>
</td>

<td class="px-4 py-3">
  <a
    [routerLink]="['/plantas', planta().id]"
    class="btn btn-ghost btn-xs btn-square cursor-pointer"
  >
    <app-icon
      className="size-3.5 text-base-content/50"
      name="chevron-right-outline"
      strokeWidth="2.0"
    />
  </a>
</td>
