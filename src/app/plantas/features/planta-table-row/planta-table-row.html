<td class="px-6 py-4">{{ planta().id }}</td>
<td class="px-6 py-4 font-semibold">
  {{ planta().name }}
</td>
<td class="px-6 py-4">{{ planta().location['latitude'] }}, {{ planta().location['longitude'] }}</td>
<td class="px-6 py-4">{{ planta().capacity }}</td>
<td class="px-6 py-4">{{ planta().user_id }}</td>
<td class="px-6 py-4">{{ planta().created_at }}</td>
<td class="px-6 py-4">
  <img
    class="h-12 rounded-lg border border-gray-200 object-cover"
    [src]="planta().photo || '/placeholder.png'"
  />
</td>
<td class="px-6 py-4">
  <a
    [routerLink]="['/plantas', planta().id]"
    class="flex items-center rounded-lg border border-gray-300 px-4 py-2 text-sm hover:bg-gray-100"
  >
    Ver Mas
    <svg
      class="ms-1.5 -me-0.5 h-4 w-4 rtl:rotate-180"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      fill="none"
      viewBox="0 0 24 24"
    >
      <path
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M19 12H5m14 0-4 4m4-4-4-4"
      />
    </svg>
  </a>
</td>
