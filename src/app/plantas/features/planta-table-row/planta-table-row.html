<td>{{ planta().id }}</td>
<td>
  {{ planta().name }}
</td>
<td>{{ planta().latitude }}, {{ planta().longitude }}</td>
<td>{{ planta().capacity }}</td>
<td>{{ planta().user_id }}</td>
<td>{{ planta().created_at }}</td>
<td>
  <div class="aspect-video h-20 overflow-hidden">
    <img [src]="planta().photo_url" class="rounded-box h-full w-full object-cover" />
  </div>
</td>
<td>
  <a [routerLink]="['/plantas', planta().id]" class="btn btn-primary btn-soft min-w-max">
    Ver Mas
    <app-icon className="ms-1.5 -me-0.5 size-4 rtl:rotate-180" name="chevron-right" />
  </a>
</td>
