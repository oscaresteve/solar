<td>{{ planta().id }}</td>
<td>
  {{ planta().name }}
</td>
<td>{{ planta().latitude }}, {{ planta().longitude }}</td>
<td>{{ planta().capacity }} MW</td>
<td>{{ planta().user_id }}</td>
<td>{{ planta().created_at }}</td>
<td>
  <div class="rounded-box aspect-video h-20 overflow-hidden shadow-md">
    <img [src]="planta().photo_url" class="h-full w-full object-cover" />
  </div>
</td>
<td>
  <a [routerLink]="['/plantas', planta().id]" class="btn btn-primary btn-soft min-w-max shadow-md">
    Ver más
    <app-icon className="ms-1.5 -me-0.5 size-4 rtl:rotate-180" name="chevron-right" />
  </a>
</td>
