<app-navbar></app-navbar>
<section class="min-h-screen bg-gray-100">
  <header class="border-b border-gray-200 bg-white px-6 py-6">
    <h1 class="text-2xl font-semibold text-gray-900">Pagina favoritos</h1>
    <p class="mt-1 text-sm text-gray-500">Plantas favoritas del usuario</p>
  </header>
  <div class="mx-auto grid gap-6 px-6 py-8 sm:grid-cols-2 lg:grid-cols-3">
    @if (loading()) {
      <p class="text-xl text-gray-500 italic">Cargando las plantas...</p>
    }
    @if (error()) {
      <p class="text-xl text-red-500 italic">Error al cargar las planas...</p>
    }
    @if (!loading() && !error()) {
      @for (planta of plantasFavorites(); track planta.id) {
        <app-planta-item
          [planta]="planta"
          [isFavorite]="isFavorite(planta.id)"
          (favoriteToggled)="toggleFavorite(planta)"
        ></app-planta-item>
      } @empty {
        <p class="text-xl text-gray-500 italic">No hay plantas que mostrar...</p>
      }
    }
  </div>
</section>
