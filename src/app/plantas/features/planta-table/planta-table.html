<div class="px-6 py-8">
  <table
    class="mx-auto table-auto border-separate border-spacing-0 overflow-hidden rounded-lg border border-gray-200 bg-white text-left"
  >
    <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-3 text-sm font-semibold text-gray-700">ID</th>
        <th class="px-6 py-3 text-sm font-semibold text-gray-700">Nombre</th>
        <th class="px-6 py-3 text-sm font-semibold text-gray-700">Ubicación</th>
        <th class="px-6 py-3 text-sm font-semibold text-gray-700">Capacidad</th>
        <th class="px-6 py-3 text-sm font-semibold text-gray-700">Usuario</th>
        <th class="px-6 py-3 text-sm font-semibold text-gray-700">Fecha Creación</th>
        <th class="px-6 py-3 text-sm font-semibold text-gray-700">Foto</th>
        <th class="px-6 py-3 text-sm font-semibold text-gray-700">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @if (loading()) {
        <tr>
          <td colspan="8" class="px-6 py-4 text-gray-500 italic">Cargando las plantas...</td>
        </tr>
      }
      @if (error()) {
        <tr>
          <td colspan="8" class="px-6 py-4 text-red-500 italic">Error al cargar las plantas...</td>
        </tr>
      }
      @if (!loading() && !error()) {
        @for (planta of plantas(); track planta.id) {
          <tr
            class="transition duration-200 hover:bg-gray-50"
            app-planta-table-row
            [plantaId]="planta"
          ></tr>
        } @empty {
          <tr>
            <td colspan="8" class="px-6 py-4 text-gray-500 italic">
              No hay plantas que mostrar...
            </td>
          </tr>
        }
      }
    </tbody>
  </table>
</div>
