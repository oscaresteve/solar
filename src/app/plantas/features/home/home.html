<section class="mx-auto max-w-6xl px-6 py-8">
  <header class="mb-8 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <app-icon className="size-5 text-base-content/50" strokeWidth="2.0" name="home-outline" />
      <h1 class="text-xl font-semibold">Home</h1>
    </div>
    <button class="btn btn-ghost btn-square" (click)="onRetryLoad()">
      <app-icon className="size-4 text-base-content/50" strokeWidth="2.0" name="arrow-path" />
    </button>
  </header>

  <app-planta-list
    [loading]="loading()"
    [error]="error()"
    [sortedPlantas]="sortedPlantas()"
    [favoriteIds]="favoritePlantaIds()"
    (retryLoad)="onRetryLoad()"
    (favoriteToggled)="onToggleFavorite($event)"
  ></app-planta-list>
</section>
