<div class="grid grid-cols-3 gap-6">
  @if (loading()) {
    <app-card-skeleton />
    <app-card-skeleton />
    <app-card-skeleton />
  }
  @if (error()) {
    <p class="text-xl text-red-500 italic">Error al cargar las plantas.</p>
  }
  @if (!loading() && !error()) {
    @for (planta of plantas(); track planta.id) {
      <app-planta-item
        [planta]="planta"
        [isFavorite]="isFavorite(planta.id)"
        (favoriteToggled)="toggleFavorite(planta)"
      ></app-planta-item>
    } @empty {
      <p class="text-xl text-gray-500 italic">No hay plantas para mostrar.</p>
    }
  }
</div>

<div class="mt-10 flex justify-center">
  <div class="join">
    <button
      class="join-item btn btn-ghost"
      [disabled]="!hasPreviousPage()"
      (click)="onPreviousPage()"
    >
      «
    </button>
    <button class="join-item btn btn-ghost">{{ currentPage() + 1 }}</button>
    <button class="join-item btn btn-ghost" [disabled]="!hasNextPage()" (click)="onNextPage()">
      »
    </button>
  </div>
</div>
