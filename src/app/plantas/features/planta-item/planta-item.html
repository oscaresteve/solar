<div class="rounded-lg border border-gray-200 bg-white p-5">
  <img class="rounded border border-gray-200" [src]="planta().photo_url" alt="" />
  <div class="py-2">
    <h5 class="text-lg font-semibold text-gray-900">
      {{ planta().name }}
    </h5>

    <p class="mt-2 text-sm text-gray-600">
      Ubicacion: Latitud: {{ planta().location['latitude'] }}, Longitud:
      {{ planta().location['longitude'] }}
      Capacidad: {{ planta().capacity }} MW
    </p>

    <div class="mt-6 flex items-center justify-between">
      <a
        [routerLink]="['/plantas', planta().id]"
        class="flex items-center rounded border border-gray-300 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50"
      >
        Ver Mas
        <svg
          class="ms-1.5 -me-0.5 h-4 w-4 rtl:rotate-180"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 12H5m14 0-4 4m4-4-4-4"
          />
        </svg>
      </a>

      <button
        class="rounded border border-gray-300 bg-white px-2 py-1 text-sm text-gray-700 hover:bg-gray-50"
        type="button"
        (click)="toggleFavorite()"
      >
        {{ planta().favorite ? 'Favorita' : 'Marcar' }}
      </button>
    </div>
  </div>
</div>
