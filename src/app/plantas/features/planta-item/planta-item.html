<div class="card bg-base-200 shadow-xl">
  <figure class="aspect-video overflow-hidden">
    <img [src]="planta().photo_url" alt="Imagen" class="h-full w-full object-cover" />
  </figure>
  <div class="card-body">
    <h3 class="card-title">
      {{ planta().name }}
    </h3>

    <p>{{ planta().description }}</p>

    <ul>
      <li>
        <p>Latitud: {{ planta().latitude }}</p>
      </li>
      <li>
        <p>Longitud: {{ planta().longitude }}</p>
      </li>
      <li>
        <p>Capacidad instalada: {{ planta().capacity }} MW</p>
      </li>
    </ul>

    <div class="card-actions mt-4 justify-between">
      <a
        [routerLink]="['/plantas', planta().id]"
        class="btn btn-primary btn-soft min-w-max shadow-md"
      >
        Ver más
        <app-icon className="ms-1.5 -me-0.5 size-4 rtl:rotate-180" name="chevron-right" />
      </a>

      <button
        type="button"
        (click)="toggleFavorite()"
        class="transform transition-transform duration-100 ease-out active:scale-110"
      >
        @if (isFavorite()) {
          <app-icon className="size-8 text-error" name="heart-solid"></app-icon>
        } @else {
          <app-icon className="size-8 text-error" name="heart"></app-icon>
        }
      </button>
    </div>
  </div>
</div>
