<div class="rounded-xl border border-gray-300 bg-white p-6 shadow-md">
  <img
    class="rounded-xl border border-gray-300"
    [src]="planta().photo || '/placeholder.png'"
    alt=""
  />
  <div class="py-2">
    <h5 class="text-xl font-semibold text-gray-800">
      {{ planta().name }}
    </h5>

    <p class="mt-2 text-gray-600">
      Ubicacion: Latitud: {{ planta().location['latitude'] }}, Longitud:
      {{ planta().location['latitude'] }}
      Capacidad: {{ planta().capacity }}
    </p>

    <div class="mt-6 flex items-center justify-between">
      <a
        [routerLink]="['/plantas', planta().id]"
        class="flex items-center rounded-lg border border-gray-300 px-4 py-2 text-sm hover:bg-gray-100"
      >
        Ver Mas
        <svg
          class="ms-1.5 -me-0.5 h-4 w-4 rtl:rotate-180"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 12H5m14 0-4 4m4-4-4-4"
          />
        </svg>
      </a>

      <span class="text-2xl" style="cursor: pointer" (click)="toggleFavorite()">{{
        planta().favorite ? '♥️' : '🖤'
      }}</span>
    </div>
  </div>
</div>
