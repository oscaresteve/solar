<app-navbar></app-navbar>
<section class="min-h-screen bg-gray-50">
  <header class="bg-white px-6 py-6 shadow-sm">
    <h1 class="text-3xl font-bold text-gray-900">Página detallada de planta solar</h1>
    <p class="mt-2 text-sm text-gray-500">Información detallada y logs de la planta</p>
  </header>

  <div class="px-6 py-8">
    <div class="rounded-xl border border-gray-300 bg-white p-6 shadow-md">
      <h1 class="text-3xl font-semibold text-gray-800">
        {{ planta()?.name }}
      </h1>
      <img class="mt-6 rounded-xl border border-gray-300" [src]="planta()?.photo_url" alt="" />
    </div>
    <app-planta-logs-list></app-planta-logs-list>
  </div>
</section>
