<section class="bg-neutral-100 min-h-screen py-12">
  <div class="mx-auto max-w-screen-xl px-4 lg:px-8 grid lg:grid-cols-2 gap-12 items-start">
    <!-- Header -->
    <header class="mb-6 lg:mb-0">
      <h1 class="text-3xl lg:text-4xl font-extrabold text-gray-900 mb-2">
        Página detallada de planta solar
      </h1>
      <p class="text-gray-600 text-sm lg:text-base">Información detallada y logs de la planta</p>
    </header>

    <!-- Info planta -->
    <div class="text-gray-700 dark:text-gray-300 space-y-3">
      <h2 class="text-3xl lg:text-4xl font-bold tracking-tight text-gray-900">
        {{ planta()?.name }}
      </h2>
      <p class="text-base lg:text-lg">
        <span class="font-medium">Latitud:</span> {{ planta()?.location?.['latitude'] }},
        <span class="font-medium">Longitud:</span> {{ planta()?.location?.['longitude'] }}
      </p>
      <p class="text-base lg:text-lg">
        <span class="font-medium">Capacidad:</span> {{ planta()?.capacity }}
      </p>
    </div>

    <!-- Imagen -->
    <div class="mt-6 lg:mt-0 lg:col-span-2">
      <img
        class="w-full rounded-xl shadow-md object-cover"
        [src]="planta()?.photo ? planta()?.photo : '/placeholder.png'"
        alt="Foto de la planta solar"
      />
    </div>
  </div>
  <h1 class="text-3xl lg:text-4xl font-extrabold text-gray-900 mb-2">Logs de la planta solar</h1>
  <app-planta-logs-list></app-planta-logs-list>
</section>
