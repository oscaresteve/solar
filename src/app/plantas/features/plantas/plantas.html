<section class="bg-base-100 mx-48 min-h-screen">
  <header class="mb-10 flex flex-row items-center justify-between gap-3">
    <div>
      <h1 class="text-base-content text-2xl font-semibold">Vista detallada de plantas solares</h1>
      <p class="text-base-content/70 mt-2 text-sm">Vista de tabla con detalles y comparación.</p>
    </div>
    <div class="flex items-center">
      <button
        class="btn btn-success btn-soft shadow-md"
        type="button"
        [routerLink]="['/plantas/new-planta']"
      >
        Crear planta
      </button>
    </div>
  </header>

  <app-planta-table
    [plantas]="filteredAndSortedPlantas()"
    [loading]="loading()"
    [error]="error()"
    (retryRequested)="onRetryLoad()"
    (activeFilterChanged)="onActiveFilterChanged($event)"
    (sortChanged)="onSortChanged($event)"
  ></app-planta-table>

  @if (!error() && plantas().length > 0) {
    <div class="join mt-10 flex justify-center">
      <button
        class="join-item btn btn-ghost"
        [disabled]="!hasPreviousPage()"
        (click)="onPreviousPage()"
      >
        «
      </button>
      <button class="join-item btn btn-ghost">{{ currentPage() + 1 }}</button>
      <button class="join-item btn btn-ghost" [disabled]="!hasNextPage()" (click)="onNextPage()">
        »
      </button>
    </div>
  }
</section>
