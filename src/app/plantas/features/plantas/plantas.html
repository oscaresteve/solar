<section class="mx-auto max-w-6xl px-6">
  <header class="mt-8 mb-8 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <app-icon
        className="size-5 text-base-content/50"
        strokeWidth="2.0"
        name="bolt-outline"
      ></app-icon>

      <h1 class="text-base-content text-xl font-semibold">Plantas</h1>
    </div>

    <div>
      <button
        class="btn btn-primary btn-sm gap-1.5"
        type="button"
        [routerLink]="['/plantas/new-planta']"
      >
        <app-icon name="plus-circle-outline" className="size-3.5" strokeWidth="2.5" />
        Nueva planta
      </button>
      <button class="btn btn-ghost" (click)="onRetryLoad()">
        <app-icon
          className="size-4 text-base-content/50"
          strokeWidth="2.0"
          name="arrow-path"
        ></app-icon>
      </button>
    </div>
  </header>

  <div class="mb-4 flex justify-between">
    <div class="flex items-center gap-4">
      <fieldset class="fieldset">
        <legend class="fieldset-legend">Estado</legend>
        <select
          class="select select-sm w-28"
          [value]="activeFilter()"
          (change)="activeFilter.set($any($event.target).value)"
        >
          <option value="all">Todas</option>
          <option value="active">Activas</option>
          <option value="inactive">Inactivas</option>
        </select>
      </fieldset>

      <fieldset class="fieldset">
        <legend class="fieldset-legend">Ordenar por</legend>
        <select
          class="select select-sm w-44"
          [value]="sortField()"
          (change)="sortField.set($any($event.target).value)"
        >
          <option value="created_at">Fecha de creación</option>
          <option value="name">Nombre</option>
          <option value="capacity">Capacidad</option>
        </select>
      </fieldset>
    </div>

    <fieldset class="fieldset">
      <legend class="fieldset-legend">Dirección</legend>
      <select
        class="select select-sm w-36"
        [value]="sortDirection()"
        (change)="sortDirection.set($any($event.target).value)"
      >
        <option value="desc">Descendente</option>
        <option value="asc">Ascendente</option>
      </select>
    </fieldset>
  </div>

  <app-planta-table
    [plantas]="filteredAndSortedPlantas()"
    [loading]="loading()"
    [error]="error()"
    (retryRequested)="onRetryLoad()"
  ></app-planta-table>

  @if (!error() && plantas().length > 0) {
    <div class="join mt-10 flex justify-center">
      <button
        class="join-item btn btn-ghost"
        [disabled]="!hasPreviousPage()"
        (click)="onPreviousPage()"
      >
        «
      </button>
      <button class="join-item btn btn-ghost">{{ currentPage() + 1 }}</button>
      <button class="join-item btn btn-ghost" [disabled]="!hasNextPage()" (click)="onNextPage()">
        »
      </button>
    </div>
  }
</section>
