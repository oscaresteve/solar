<section class="bg-base-100 mx-48 min-h-screen">
  <header class="mb-10 flex flex-row items-center justify-between gap-3">
    <div>
      <h1 class="text-base-content text-2xl font-semibold">Pagina detallada de plantas solares</h1>
      <p class="text-base-content/70 mt-2 text-sm">Vista tipo tabla con detalles y comparación.</p>
    </div>
    <div class="flex items-center">
      <button class="btn btn-success btn-soft" type="button" [routerLink]="['/plantas/new-planta']">
        Crear Planta
      </button>
    </div>
  </header>

  <app-planta-table
    [plantas]="plantas()"
    [loading]="loading()"
    [error]="error()"
  ></app-planta-table>
</section>
