<div class="navbar bg-base-100 shadow-sm">
  <div class="navbar-start">
    <div class="dropdown">
      <div tabindex="0" role="button" class="btn btn-ghost">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h7"
          />
        </svg>
      </div>
      <ul
        tabindex="-1"
        class="menu menu-lg dropdown-content bg-base-200 rounded-box z-1 mt-2 w-xs p-2 font-semibold shadow-xl"
      >
        <li>
          <a
            [routerLink]="['/dashboard']"
            routerLinkActive="font-bold text-primary"
            #dashboardLink="routerLinkActive"
          >
            <app-icon
              [name]="dashboardLink.isActive ? 'home-solid' : 'home-outline'"
              strokeWidth="2.0"
              className="size-5"
            ></app-icon>
            Dashboard
          </a>
        </li>
        <li>
          <a
            [routerLink]="['/plantas']"
            routerLinkActive="font-bold text-primary"
            #plantasLink="routerLinkActive"
          >
            <app-icon
              [name]="plantasLink.isActive ? 'bolt-solid' : 'bolt-outline'"
              strokeWidth="2.0"
              className="size-5"
            ></app-icon>
            Plantas</a
          >
        </li>
        <li>
          <a
            [routerLink]="['/favorites']"
            routerLinkActive="font-bold text-primary"
            #favoritesLink="routerLinkActive"
          >
            <app-icon
              [name]="favoritesLink.isActive ? 'heart-solid' : 'heart-outline'"
              strokeWidth="2.0"
              className="size-5"
            ></app-icon>
            Favoritos</a
          >
        </li>
      </ul>
    </div>
  </div>

  <div class="navbar-center">
    <a class="btn btn-ghost text-3xl font-bold" [routerLink]="['/dashboard']">Solar</a>
  </div>

  <div class="navbar-end">
    <label class="swap swap-rotate mr-4">
      <input type="checkbox" class="theme-controller" value="dark" />

      <svg
        class="swap-off size-7 fill-current"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
      >
        <path
          d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"
        />
      </svg>

      <svg
        class="swap-on size-7 fill-current"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
      >
        <path
          d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"
        />
      </svg>
    </label>

    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-ghost btn-circle">
        @if (photo_url()) {
          <div class="avatar">
            <div class="w-10 rounded-full">
              <img [src]="photo_url()" />
            </div>
          </div>
        } @else {
          <div class="avatar avatar-placeholder">
            <div class="bg-neutral text-neutral-content w-10 rounded-full">
              <span class="text-lg font-bold">{{ first_name()?.charAt(0) }}</span>
            </div>
          </div>
        }
      </div>
      <ul
        tabindex="-1"
        class="menu menu-lg dropdown-content bg-base-200 rounded-box z-1 mt-2 w-xs p-2 font-semibold shadow-xl"
      >
        <li>
          <a
            [routerLink]="['/user/cuenta']"
            routerLinkActive="font-bold text-primary"
            #cuentaLink="routerLinkActive"
          >
            <app-icon
              [name]="cuentaLink.isActive ? 'user-solid' : 'user-outline'"
              strokeWidth="2.0"
              className="size-5"
            ></app-icon>
            Cuenta</a
          >
        </li>
        <li>
          <a routerLinkActive="font-bold text-primary" #configuracionLink="routerLinkActive">
            <app-icon
              [name]="configuracionLink.isActive ? 'cog-solid' : 'cog-outline'"
              strokeWidth="2.0"
              className="size-5"
            ></app-icon
            >Configuración</a
          >
        </li>
        <li>
          <button (click)="logOut()" class="text-error" [disabled]="loading()">
            @if (loading()) {
              <span class="loading loading-spinner"></span>
            } @else {
              <app-icon
                name="arrow-right-on-rectangle-outline"
                strokeWidth="2.0"
                className="size-5"
              ></app-icon
              >Cerrar sesión
            }
          </button>
        </li>
      </ul>
    </div>
  </div>
</div>
