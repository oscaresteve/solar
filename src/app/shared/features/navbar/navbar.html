<div class="navbar bg-base-100">
  <div class="navbar-start">
    <div class="dropdown">
      <div tabindex="0" role="button" class="btn btn-ghost">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h7"
          />
        </svg>
      </div>
      <ul
        tabindex="-1"
        class="menu menu-lg dropdown-content bg-base-200 rounded-box z-1 mt-2 w-sm p-2 shadow-lg"
      >
        <li>
          <a [routerLink]="['/dashboard']" routerLinkActive="font-semibold text-primary"
            >Dashboard</a
          >
        </li>
        <li>
          <a [routerLink]="['/plantas']" routerLinkActive="font-semibold text-primary">Plantas</a>
        </li>
        <li>
          <a [routerLink]="['/favorites']" routerLinkActive="font-semibold text-primary"
            >Favoritos</a
          >
        </li>
      </ul>
    </div>
  </div>

  <div class="navbar-center">
    <a class="btn btn-ghost text-2xl" [routerLink]="['/dashboard']">Solar</a>
  </div>

  <div class="navbar-end">
    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-ghost btn-circle">
        @if (avatarUrl) {
          <div class="avatar">
            <div class="w-10 rounded-full">
              <img src="https://img.daisyui.com/images/profile/demo/yellingcat@192.webp" />
            </div>
          </div>
        } @else {
          <div class="avatar avatar-placeholder">
            <div class="bg-neutral text-neutral-content w-10 rounded-full">
              <span class="text-xs">{{ first_name()?.charAt(0) }}</span>
            </div>
          </div>
        }
      </div>
      <ul
        tabindex="-1"
        class="menu menu-lg dropdown-content bg-base-200 rounded-box z-1 mt-2 w-sm p-2 shadow-xl"
      >
        <li>
          <a [routerLink]="['/user/cuenta']" routerLinkActive="font-semibold text-primary"
            >Cuenta</a
          >
        </li>
        <li><a>Settings</a></li>
        <li><a (click)="logOut()" class="text-error">Log Out</a></li>
      </ul>
    </div>
  </div>
</div>
