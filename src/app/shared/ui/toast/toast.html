<div class="toast">
  @for (toast of toasts(); track toast) {
    <div
      class="alert"
      [class.alert-success]="toast.type === 'success'"
      [class.alert-error]="toast.type === 'error'"
      [class.alert-warning]="toast.type === 'warning'"
      [class.alert-info]="toast.type === 'info'"
    >
      @switch (toast.type) {
        @case ('success') {
          <app-icon name="check-circle-outline" className="size-5" />
        }
        @case ('error') {
          <app-icon name="exclamation-circle-outline" className="size-5" />
        }
        @case ('warning') {
          <app-icon name="exclamation-triangle-outline" className="size-5" />
        }
        @case ('info') {
          <app-icon name="info-circle-outline" className="size-5" />
        }
      }

      <span>{{ toast.message }}</span>
    </div>
  }
</div>
