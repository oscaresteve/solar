<section class="min-h-screen bg-gray-100">
  <div class="mx-auto flex min-h-screen flex-col items-center justify-center px-6 py-10">
    <div class="w-full max-w-md rounded-xl border border-gray-300 bg-white p-6 shadow-md">
      <div class="space-y-5">
        <div>
          <h1 class="text-2xl font-semibold text-gray-900">Inicia sesion con tu cuenta</h1>
          <p class="mt-2 text-sm text-gray-500">Accede para ver el panel y tus plantas.</p>
        </div>
        <form class="space-y-5" action="#" [formGroup]="form" (ngSubmit)="submit()">
          <div>
            <label for="email" class="mb-2 block text-sm font-medium text-gray-700">Tu email</label>
            <input
              type="email"
              name="email"
              id="email"
              formControlName="email"
              class="block w-full rounded-lg border px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 focus:ring-2 focus:ring-gray-900/10 focus:outline-none"
              [class.border-red-500]="
                form.controls.email.invalid &&
                (form.controls.email.dirty || form.controls.email.touched)
              "
              [class.border-blue-500]="
                form.controls.email.valid &&
                (form.controls.email.dirty || form.controls.email.touched)
              "
              [class.border-gray-300]="!(form.controls.email.dirty || form.controls.email.touched)"
              placeholder="name@company.com"
            />
          </div>
          <div>
            <label for="password" class="mb-2 block text-sm font-medium text-gray-700"
              >Contraseña</label
            >
            <input
              type="password"
              name="password"
              id="password"
              formControlName="password"
              placeholder="••••••••"
              class="block w-full rounded-lg border bg-white px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 focus:ring-2 focus:ring-gray-900/10 focus:outline-none"
              [class.border-red-500]="
                form.controls.password.invalid &&
                (form.controls.password.dirty || form.controls.password.touched)
              "
              [class.border-blue-500]="
                form.controls.password.valid &&
                (form.controls.password.dirty || form.controls.password.touched)
              "
              [class.border-gray-300]="
                !(form.controls.password.dirty || form.controls.password.touched)
              "
            />
          </div>
          <div class="flex items-center justify-between">
            <div class="flex items-start">
              <div class="flex h-5 items-center">
                <input
                  id="remember"
                  aria-describedby="remember"
                  type="checkbox"
                  class="h-4 w-4 rounded border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-gray-900/10 focus:outline-none"
                />
              </div>
              <div class="ml-3 text-sm">
                <label for="remember" class="text-gray-600">Recuerdame</label>
              </div>
            </div>
            <a
              href="#"
              class="text-sm font-medium text-gray-700 hover:text-gray-900 hover:underline"
              >Has olvidado tu contraseña?</a
            >
          </div>
          <button
            type="submit"
            class="w-full rounded-lg bg-gray-900 px-5 py-2.5 text-center text-sm font-medium text-white hover:bg-gray-800 focus:ring-2 focus:ring-gray-900/20 focus:outline-none"
          >
            Iniciar sesion
          </button>
          <p class="text-sm text-gray-500">
            No tienes tu cuenta todavia?
            <a [routerLink]="['/auth/sign-up']" class="font-medium text-gray-900 hover:underline"
              >Registrate</a
            >
          </p>
        </form>
      </div>
    </div>
  </div>
</section>
