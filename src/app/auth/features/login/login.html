<section class="bg-base-100 flex items-center justify-center">
  <form
    class="bg-base-200 border-base-300 rounded-box fieldset m-auto w-xl border p-4 shadow-xl"
    [formGroup]="form"
    (ngSubmit)="onSubmit($event)"
  >
    <h1 class="text-base-content mb-6 text-3xl">Iniciar sesión</h1>

    <label for="email" class="fieldset-label">Correo electrónico</label>
    <input
      type="email"
      name="email"
      id="email"
      formControlName="email"
      class="input w-full"
      [class.border-red-500]="
        form.controls.email.invalid && (form.controls.email.dirty || form.controls.email.touched)
      "
      [class.border-blue-500]="
        form.controls.email.valid && (form.controls.email.dirty || form.controls.email.touched)
      "
      [class.border-gray-300]="!(form.controls.email.dirty || form.controls.email.touched)"
      placeholder="nombre@empresa.com"
    />

    <label for="password" class="fieldset-label">Contraseña</label>
    <input
      type="password"
      name="password"
      id="password"
      formControlName="password"
      placeholder="••••••••"
      class="input w-full"
      [class.border-red-500]="
        form.controls.password.invalid &&
        (form.controls.password.dirty || form.controls.password.touched)
      "
      [class.border-blue-500]="
        form.controls.password.valid &&
        (form.controls.password.dirty || form.controls.password.touched)
      "
      [class.border-gray-300]="!(form.controls.password.dirty || form.controls.password.touched)"
    />

    <button
      type="submit"
      class="btn btn-block btn-soft btn-primary my-4 shadow-md"
      [disabled]="loading()"
    >
      @if (loading()) {
        <span class="loading loading-spinner"></span>
      }
      Iniciar sesión
    </button>

    <p class="text-base-content/70 text-sm">
      ¿Aún no tienes una cuenta?
      <a [routerLink]="['/auth/sign-up']" class="link link-hover text-base-content/70 font-semibold"
        >Regístrate</a
      >
    </p>
  </form>
</section>
