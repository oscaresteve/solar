<section class="mx-48">
  <form
    class="bg-base-200 border-base-300 rounded-box fieldset m-auto w-xl border p-6 shadow-xl"
    [formGroup]="form"
    (ngSubmit)="onSubmit($event)"
  >
    <h1 class="text-base-content text-3xl font-bold">Crear cuenta</h1>

    <div class="mt-4">
      <label class="input validator w-full">
        <app-icon name="user-icon" className="size-6 text-base-content/50 mr-2" />
        <input
          type="text"
          name="firstName"
          id="firstName"
          formControlName="firstName"
          [aria-invalid]="form.controls.firstName.invalid && form.controls.firstName.touched"
          class="text-base-content/90 validator text-lg font-semibold"
          placeholder="Tu nombre"
        />
      </label>
      <p class="validator-hint hidden text-xs font-semibold">El nombre es requerido.</p>
    </div>

    <div class="mt-4">
      <label class="input validator w-full">
        <app-icon name="user-icon" className="size-6 text-base-content/50 mr-2" />
        <input
          type="text"
          name="lastName"
          id="lastName"
          formControlName="lastName"
          [aria-invalid]="form.controls.lastName.invalid && form.controls.lastName.touched"
          class="text-base-content/90 validator text-lg font-semibold"
          placeholder="Tu apellidos"
        />
      </label>
      <p class="validator-hint hidden text-xs font-semibold">Los apellidos son requeridos.</p>
    </div>

    <div class="mt-4">
      <label class="input validator w-full">
        <app-icon name="mail-icon" className="size-6 text-base-content/50 mr-2" />
        <input
          type="email"
          name="email"
          id="email"
          formControlName="email"
          [aria-invalid]="form.controls.email.invalid && form.controls.email.touched"
          class="text-base-content/90 validator text-lg font-semibold"
          placeholder="Tu correo electrónico"
        />
      </label>
      <p class="validator-hint hidden text-xs font-semibold">
        Introduce un correo electrónico válido.
      </p>
    </div>

    <div class="mt-4">
      <label class="input validator w-full">
        <app-icon name="lock-closed-icon" className="size-6 text-base-content/50 mr-2" />
        <input
          type="password"
          name="password"
          id="password"
          formControlName="password"
          [aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
          class="text-base-content/90 validator text-lg font-semibold"
          placeholder="Tu contraseña"
        />
      </label>
      <p class="validator-hint hidden text-xs font-semibold">Introduce una contraseña válida.</p>
    </div>

    <div class="mt-4">
      <label class="input validator w-full">
        <app-icon name="lock-closed-icon" className="size-6 text-base-content/50 mr-2" />
        <input
          type="password"
          name="confirmPassword"
          id="confirmPassword"
          formControlName="confirmPassword"
          [aria-invalid]="
            form.controls.confirmPassword.touched &&
            (form.hasError('passwordMismatch') || form.controls.confirmPassword.invalid)
          "
          class="text-base-content/90 validator text-lg font-semibold"
          placeholder="Confirma tu contraseña"
        />
      </label>
      <p class="validator-hint hidden text-xs font-semibold">Las contraseñas deben coincidir.</p>
    </div>

    <button
      type="submit"
      class="btn btn-block btn-soft btn-primary my-4 shadow-md"
      [disabled]="loading() || form.invalid"
    >
      @if (loading()) {
        <span class="loading loading-spinner"></span>
      }
      Crear cuenta
    </button>

    <p class="text-base-content/70 text-sm">
      ¿Ya tienes una cuenta?
      <a [routerLink]="['/auth/log-in']" class="link link-hover text-base-content/70 font-semibold"
        >Inicia sesión aquí</a
      >
    </p>
  </form>
</section>
