<section class="min-h-screen bg-gray-100">
  <div class="mx-auto flex min-h-screen flex-col items-center justify-center px-6 py-10">
    <div class="w-full max-w-md rounded-xl border border-gray-300 bg-white p-6 shadow-md">
      <div class="space-y-5">
        <div>
          <h1 class="text-2xl font-semibold text-gray-900">Crea tu cuenta</h1>
          <p class="mt-2 text-sm text-gray-500">Empieza a gestionar tus plantas solares.</p>
        </div>
        <form class="space-y-5" action="#" [formGroup]="form" (ngSubmit)="onSubmit($event)">
          <div>
            <label for="firstName" class="mb-2 block text-sm font-medium text-gray-700"
              >Nombre</label
            >
            <input
              type="text"
              name="firstName"
              id="firstName"
              formControlName="firstName"
              class="block w-full rounded-lg border bg-white px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 focus:ring-2 focus:ring-gray-900/10 focus:outline-none"
              [class.border-red-500]="
                form.controls.firstName.invalid &&
                (form.controls.firstName.dirty || form.controls.firstName.touched)
              "
              [class.border-blue-500]="
                form.controls.firstName.valid &&
                (form.controls.firstName.dirty || form.controls.firstName.touched)
              "
              [class.border-gray-300]="
                !(form.controls.firstName.dirty || form.controls.firstName.touched)
              "
              placeholder="Tu nombre"
            />
          </div>
          <div>
            <label for="lastName" class="mb-2 block text-sm font-medium text-gray-700"
              >Apellidos</label
            >
            <input
              type="text"
              name="lastName"
              id="lastName"
              formControlName="lastName"
              class="block w-full rounded-lg border bg-white px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 focus:ring-2 focus:ring-gray-900/10 focus:outline-none"
              [class.border-red-500]="
                form.controls.lastName.invalid &&
                (form.controls.lastName.dirty || form.controls.lastName.touched)
              "
              [class.border-blue-500]="
                form.controls.lastName.valid &&
                (form.controls.lastName.dirty || form.controls.lastName.touched)
              "
              [class.border-gray-300]="
                !(form.controls.lastName.dirty || form.controls.lastName.touched)
              "
              placeholder="Tus apellidos"
            />
          </div>
          <div>
            <label for="email" class="mb-2 block text-sm font-medium text-gray-700"
              >Correo electronico</label
            >
            <input
              type="email"
              name="email"
              id="email"
              formControlName="email"
              class="block w-full rounded-lg border bg-white px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 focus:ring-2 focus:ring-gray-900/10 focus:outline-none"
              [class.border-red-500]="
                form.controls.email.invalid &&
                (form.controls.email.dirty || form.controls.email.touched)
              "
              [class.border-blue-500]="
                form.controls.email.valid &&
                (form.controls.email.dirty || form.controls.email.touched)
              "
              [class.border-gray-300]="!(form.controls.email.dirty || form.controls.email.touched)"
              placeholder="name@company.com"
            />
          </div>
          <div>
            <label for="password" class="mb-2 block text-sm font-medium text-gray-700"
              >Contraseña</label
            >
            <input
              type="password"
              name="password"
              id="password"
              formControlName="password"
              placeholder="••••••••"
              class="block w-full rounded-lg border bg-white px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 focus:ring-2 focus:ring-gray-900/10 focus:outline-none"
              [class.border-red-500]="
                form.controls.password.invalid &&
                (form.controls.password.dirty || form.controls.password.touched)
              "
              [class.border-blue-500]="
                form.controls.password.valid &&
                (form.controls.password.dirty || form.controls.password.touched)
              "
              [class.border-gray-300]="
                !(form.controls.password.dirty || form.controls.password.touched)
              "
            />
          </div>
          <div>
            <label for="confirmPassword" class="mb-2 block text-sm font-medium text-gray-700"
              >Confirma tu contraseña</label
            >
            <input
              type="password"
              name="confirmPassword"
              id="confirmPassword"
              formControlName="confirmPassword"
              placeholder="••••••••"
              class="block w-full rounded-lg border bg-white px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 focus:ring-2 focus:ring-gray-900/10 focus:outline-none"
              [class.border-red-500]="
                (form.controls.confirmPassword.dirty || form.controls.confirmPassword.touched) &&
                (form.controls.confirmPassword.invalid || form.hasError('passwordMismatch'))
              "
              [class.border-blue-500]="
                (form.controls.confirmPassword.dirty || form.controls.confirmPassword.touched) &&
                form.controls.confirmPassword.valid &&
                !form.hasError('passwordMismatch')
              "
              [class.border-gray-300]="
                !(form.controls.confirmPassword.dirty || form.controls.confirmPassword.touched)
              "
            />
          </div>
          <div class="flex items-start">
            <div class="flex h-5 items-center">
              <input
                id="terms"
                aria-describedby="terms"
                type="checkbox"
                class="h-4 w-4 rounded border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-gray-900/10 focus:outline-none"
              />
            </div>
            <div class="ml-3 text-sm">
              <label for="terms" class="font-light text-gray-600"
                >Acepto los
                <a class="font-medium text-gray-900 hover:underline" href="#"
                  >Terminos y Condiciones</a
                ></label
              >
            </div>
          </div>
          <button
            type="submit"
            class="w-full rounded-lg bg-gray-900 px-5 py-2.5 text-center text-sm font-medium text-white hover:bg-gray-800 focus:ring-2 focus:ring-gray-900/20 focus:outline-none"
          >
            Crear cuenta
          </button>
          <p class="text-sm text-gray-500">
            Tienes ya tu cuenta?
            <a [routerLink]="['/auth/log-in']" class="font-medium text-gray-900 hover:underline"
              >Inicia sesion aqui</a
            >
          </p>
        </form>
      </div>
    </div>
  </div>
</section>
