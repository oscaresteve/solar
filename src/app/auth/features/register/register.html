<section class="bg-base-100 flex min-h-screen items-center justify-center">
  <form
    class="bg-base-200 border-base-300 rounded-box fieldset m-auto w-xl border p-4"
    [formGroup]="form"
    (ngSubmit)="onSubmit($event)"
  >
    <h1 class="text-base-content mb-6 text-3xl">Sign In</h1>

    <label for="firstName" class="fieldset-label">Nombre</label>
    <input
      type="text"
      name="firstName"
      id="firstName"
      formControlName="firstName"
      class="input w-full"
      [class.border-red-500]="
        form.controls.firstName.invalid &&
        (form.controls.firstName.dirty || form.controls.firstName.touched)
      "
      [class.border-blue-500]="
        form.controls.firstName.valid &&
        (form.controls.firstName.dirty || form.controls.firstName.touched)
      "
      [class.border-gray-300]="!(form.controls.firstName.dirty || form.controls.firstName.touched)"
      placeholder="Tu nombre"
    />

    <label for="lastName" class="fieldset-label">Apellidos</label>
    <input
      type="text"
      name="lastName"
      id="lastName"
      formControlName="lastName"
      class="input w-full"
      [class.border-red-500]="
        form.controls.lastName.invalid &&
        (form.controls.lastName.dirty || form.controls.lastName.touched)
      "
      [class.border-blue-500]="
        form.controls.lastName.valid &&
        (form.controls.lastName.dirty || form.controls.lastName.touched)
      "
      [class.border-gray-300]="!(form.controls.lastName.dirty || form.controls.lastName.touched)"
      placeholder="Tus apellidos"
    />

    <label for="email" class="fieldset-label">Correo electronico</label>
    <input
      type="email"
      name="email"
      id="email"
      formControlName="email"
      class="input w-full"
      [class.border-red-500]="
        form.controls.email.invalid && (form.controls.email.dirty || form.controls.email.touched)
      "
      [class.border-blue-500]="
        form.controls.email.valid && (form.controls.email.dirty || form.controls.email.touched)
      "
      [class.border-gray-300]="!(form.controls.email.dirty || form.controls.email.touched)"
      placeholder="name@company.com"
    />

    <label for="password" class="fieldset-label">Contraseña</label>
    <input
      type="password"
      name="password"
      id="password"
      formControlName="password"
      placeholder="••••••••"
      class="input w-full"
      [class.border-red-500]="
        form.controls.password.invalid &&
        (form.controls.password.dirty || form.controls.password.touched)
      "
      [class.border-blue-500]="
        form.controls.password.valid &&
        (form.controls.password.dirty || form.controls.password.touched)
      "
      [class.border-gray-300]="!(form.controls.password.dirty || form.controls.password.touched)"
    />

    <label for="confirmPassword" class="fieldset-label">Confirma tu contraseña</label>
    <input
      type="password"
      name="confirmPassword"
      id="confirmPassword"
      formControlName="confirmPassword"
      placeholder="••••••••"
      class="input w-full"
      [class.border-red-500]="
        (form.controls.confirmPassword.dirty || form.controls.confirmPassword.touched) &&
        (form.controls.confirmPassword.invalid || form.hasError('passwordMismatch'))
      "
      [class.border-blue-500]="
        (form.controls.confirmPassword.dirty || form.controls.confirmPassword.touched) &&
        form.controls.confirmPassword.valid &&
        !form.hasError('passwordMismatch')
      "
      [class.border-gray-300]="
        !(form.controls.confirmPassword.dirty || form.controls.confirmPassword.touched)
      "
    />

    <button type="submit" class="btn btn-block btn-soft btn-primary my-4" [disabled]="loading()">
      @if (loading()) {
        <span class="loading loading-spinner"></span>
      }
      Crear cuenta
    </button>

    <p class="text-base-content/70 text-sm">
      Tienes ya tu cuenta?
      <a [routerLink]="['/auth/log-in']" class="link link-hover text-base-content/70 font-semibold"
        >Inicia sesion aqui</a
      >
    </p>
  </form>
</section>
