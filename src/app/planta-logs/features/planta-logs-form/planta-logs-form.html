<section class="mx-48">
  <header class="mb-10">
    <div class="flex-row items-center justify-between">
      <h1 class="text-base-content text-2xl font-semibold">Nuevo registro</h1>
      <p class="text-base-content/70 mt-2 text-sm">Crea un nuevo registro en la planta solar</p>
    </div>
  </header>

  <div class="mb-4 flex flex-row items-center justify-between">
    <div>
      <div class="mb-2 flex items-center gap-2">
        @if (planta()?.active) {
          <span class="badge badge-soft badge-success shadow-md">Activa</span>
        } @else {
          <span class="badge badge-soft badge-error shadow-md">Inactiva</span>
        }
        <span class="badge badge-soft badge-info shadow-md">{{ planta()?.id }} </span>
      </div>
      <h1 class="text-base-content mb-2 text-4xl font-semibold">
        Nuevo registro en {{ planta()?.name }}
      </h1>
    </div>
    <div class="flex items-center gap-2 text-sm">
      <a
        class="btn btn-soft btn-warning min-w-max shadow-md"
        [routerLink]="['plantas/', planta()?.id]"
      >
        Cancelar
      </a>
    </div>
  </div>

  <form (submit)="onSubmit($event)">
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-base-200 rounded-box my-2 p-4 shadow-md">
        <p class="text-base-content mb-2 text-lg font-semibold">Producción (kWh)</p>
        <input
          class="input w-full"
          type="number"
          placeholder="46000"
          [formField]="plantaLogsForm.production"
        />
      </div>

      <div class="bg-base-200 rounded-box my-2 p-4 shadow-md">
        <p class="text-base-content mb-2 text-lg font-semibold">Consumo (kWh)</p>
        <input
          class="input w-full"
          type="number"
          placeholder="25000"
          [formField]="plantaLogsForm.consumption"
        />
      </div>
    </div>
    <div class="bg-base-200 rounded-box my-2 p-4 shadow-md">
      <p class="text-base-content mb-2 text-lg font-semibold">Mensaje</p>
      <textarea
        class="textarea w-full"
        type="text"
        placeholder="Mensaje del registro"
        [formField]="plantaLogsForm.message"
      ></textarea>
    </div>

    <button
      class="btn btn-success btn-soft btn-block mt-4 shadow-md"
      type="submit"
      [disabled]="loading()"
    >
      @if (loading()) {
        <span class="loading-spinner"></span>
      } @else {
        Guardar registro
      }
    </button>
  </form>
</section>
