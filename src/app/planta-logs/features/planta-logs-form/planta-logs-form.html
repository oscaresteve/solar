<section class="mx-auto max-w-6xl px-6 pb-16">
  <nav class="mt-6 mb-8 flex items-center gap-1.5 text-sm">
    <a routerLink="/plantas" class="text-base-content/40 hover:text-base-content transition-colors">
      Plantas
    </a>
    <span class="text-base-content/20">/</span>
    <a
      [routerLink]="['/plantas', planta()?.id]"
      class="text-base-content/40 hover:text-base-content max-w-xs truncate transition-colors"
    >
      {{ planta()?.name }}
    </a>
    <span class="text-base-content/20">/</span>
    <span class="text-base-content/70">Nuevo registro</span>
  </nav>

  <header class="mb-8 flex flex-col items-start justify-between gap-6 sm:flex-row">
    <div class="flex flex-col gap-1.5">
      <div class="flex items-center gap-1.5">
        @if (planta()?.active) {
          <span class="badge badge-xs badge-success badge-soft">Activa</span>
        } @else {
          <span class="badge badge-xs badge-error badge-soft">Inactiva</span>
        }
        <span class="badge badge-xs badge-ghost text-base-content/40">{{ planta()?.id }}</span>
      </div>
      <h1 class="text-base-content text-2xl leading-tight font-semibold">
        Nuevo registro
        <span class="text-base-content/40 font-normal"> — {{ planta()?.name }}</span>
      </h1>
      <p class="text-base-content/40 text-xs">{{ today | date: 'mediumDate' }}</p>
    </div>

    <button
      type="button"
      class="btn btn-ghost shrink-0 gap-1.5"
      (click)="onCancelClick(cancelDialog)"
    >
      <app-icon name="arrow-uturn-left-outline" className="size-3.5" strokeWidth="2.0" />
      Cancelar
    </button>
  </header>

  <dialog #cancelDialog id="modalCancelar" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box bg-base-100 border-base-300 rounded-box max-w-md border p-6 shadow-none">
      <div class="mb-4 flex items-start justify-between">
        <div>
          <h3 class="text-base-content text-base font-semibold">¿Descartar registro?</h3>
          <p class="text-base-content/50 mt-0.5 text-sm">Los datos introducidos se perderán.</p>
        </div>
        <button
          type="button"
          class="btn btn-ghost btn-xs btn-square -mt-1 -mr-1"
          (click)="cancelDialog.close()"
        >
          <app-icon
            name="x-mark-outline"
            className="size-3.5 text-base-content/40"
            strokeWidth="2.0"
          />
        </button>
      </div>
      <div class="flex items-center justify-end gap-2">
        <form method="dialog">
          <button class="btn btn-ghost">Seguir editando</button>
        </form>
        <a class="btn btn-outline gap-1.5" [routerLink]="cancelLink()">
          <app-icon name="arrow-uturn-left-outline" className="size-3.5" strokeWidth="2.0" />
          Descartar
        </a>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop bg-base-content/20">
      <button>close</button>
    </form>
  </dialog>

  <form (submit)="onSubmit($event)" class="max-w-lg">
    <div class="border-base-300 rounded-box mb-4 overflow-hidden border">
      <div class="border-base-300 flex flex-col gap-1.5 border-b px-4 py-3">
        <label class="text-base-content/40 text-sm">Producción (kWh)</label>
        <input
          class="input input-ghost text-base-content w-full px-0 text-base focus:outline-none"
          type="number"
          placeholder="46000"
          [formField]="plantaLogsForm.production"
        />
      </div>

      <div class="border-base-300 flex flex-col gap-1.5 border-b px-4 py-3">
        <label class="text-base-content/40 text-sm">Consumo (kWh)</label>
        <input
          class="input input-ghost text-base-content w-full px-0 text-base focus:outline-none"
          type="number"
          placeholder="25000"
          [formField]="plantaLogsForm.consumption"
        />
      </div>

      <div class="flex flex-col gap-1.5 px-4 py-3">
        <label class="text-base-content/40 text-sm">Mensaje</label>
        <textarea
          class="textarea textarea-ghost text-base-content w-full resize-none px-0 text-base focus:outline-none"
          rows="3"
          placeholder="Descripción del registro..."
          [formField]="plantaLogsForm.message"
        ></textarea>
      </div>
    </div>

    <button
      class="btn btn-primary w-full gap-1.5"
      type="submit"
      [disabled]="loading() || !hasUnsavedChanges()"
    >
      @if (loading()) {
        <span class="loading loading-spinner loading-xs"></span>
        Guardando...
      } @else {
        <app-icon name="plus-circle-outline" className="size-3.5" strokeWidth="2.0" />
        Crear registro
      }
    </button>
  </form>
</section>
