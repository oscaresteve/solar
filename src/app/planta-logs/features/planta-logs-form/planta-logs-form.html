<section class="mx-48">
  <header class="mt-12 mb-12 flex flex-row items-center justify-between">
    <div class="flex-row items-center justify-between">
      <div class="mb-2 flex items-center gap-2">
        @if (planta()?.active) {
          <span class="badge badge-soft badge-success font-semibold shadow-md">Activa</span>
        } @else {
          <span class="badge badge-soft badge-error font-semibold shadow-md">Inactiva</span>
        }
        <span class="badge badge-soft badge-info font-semibold shadow-md">{{ planta()?.id }} </span>
      </div>
      <h1 class="text-base-content mb-2 text-4xl font-bold">
        Nuevo registro en {{ planta()?.name }}
      </h1>
      <p class="text-base-content/70">Fecha de creación: {{ today | date: 'medium' }}</p>
    </div>
    <div class="flex items-center gap-2 text-sm font-bold">
      <a
        class="btn btn-lg btn-soft btn-warning min-w-max font-bold shadow-md"
        [routerLink]="['/plantas', planta()?.id]"
      >
        <app-icon name="arrow-uturn-left-outline" className="size-5" strokeWidth="2.5" />
        Cancelar
      </a>
    </div>
  </header>

  <form (submit)="onSubmit($event)">
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-base-200 rounded-box my-2 p-4 shadow-md">
        <p class="text-base-content/50 text-sm font-semibold">Producción (kWh)</p>
        <input
          class="input text-base-content/90 mt-2 w-full text-lg font-semibold"
          type="number"
          placeholder="46000"
          [formField]="plantaLogsForm.production"
        />
      </div>

      <div class="bg-base-200 rounded-box my-2 p-4 shadow-md">
        <p class="text-base-content/50 text-sm font-semibold">Consumo (kWh)</p>
        <input
          class="input text-base-content/90 mt-2 w-full text-lg font-semibold"
          type="number"
          placeholder="25000"
          [formField]="plantaLogsForm.consumption"
        />
      </div>
    </div>
    <div class="bg-base-200 rounded-box my-2 p-4 shadow-md">
      <p class="text-base-content/50 text-sm font-semibold">Mensaje</p>
      <textarea
        class="textarea text-base-content/90 mt-2 w-full text-lg font-semibold"
        type="text"
        placeholder="Mensaje del registro"
        [formField]="plantaLogsForm.message"
      ></textarea>
    </div>

    <button
      class="btn btn-lg btn-success btn-soft btn-block mt-4 font-bold shadow-md"
      type="submit"
      [disabled]="loading()"
    >
      @if (loading()) {
        <span class="loading-spinner"></span>
      } @else {
        <app-icon name="plus-circle-outline" className="size-5" strokeWidth="2.5" />
        Crear Registro
      }
    </button>
  </form>
</section>
